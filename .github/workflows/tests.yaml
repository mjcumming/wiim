name: CI

# Branch ruleset "Main branch protection" requires status check: Run tests
# Keep the tests job name stable; avoid a single-entry matrix or the check
# becomes "Run tests (3.N)" and GitHub branch protection must be updated.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      # Validate standalone integration structure with Home Assistant hassfest action
      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_dev.txt
            .github/workflows/constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint=.github/workflows/constraints.txt -r requirements_test.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libturbojpeg0

      - name: Check pywiim version pins
        run: python scripts/sync-pywiim-version.py

      - name: Lint with ruff
        run: |
          ruff check custom_components/wiim --line-length 120

      - name: Lint with flake8
        run: |
          flake8 custom_components/wiim --max-line-length=120 --extend-ignore=E203,W503

      - name: Type check with mypy (strict)
        run: |
          mypy --strict custom_components/wiim

      - name: Test with pytest
        run: |
          pytest tests/ --cov=custom_components/wiim --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Record tested tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"

      - name: Save tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-tested-tree-default-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
          retention-days: 30
